# Celadon: a glazed ceramic tile theme for Home Assistant, with light and dark mode in one theme.
#
# Every card is a glazed tile with a soft bulge and a gloss edge, the gaps between cards are the grout.
# Dark mode: bottle-green tiles on dark grout. Light mode: pale celadon tiles on warm grey grout.
# Rings, sliders and gauges are drawn in gold, titles and big numbers use a Didone serif from the system.
#
# Works without any add-on: the glaze, bulge and gloss edge come from plain theme variables (a gradient
# background and inset shadows on every card). With card-mod 4.x installed (optional), the card-mod-* keys
# below turn tiles of switched-on devices into a bright celadon tile, give the sidebar tiled entries
# and set the dashboard title and section headings in the Didone serif.
# Without card-mod those keys are ignored.
#
# Fonts: system fonts only, nothing is downloaded. Didone titles use Bodoni 72 or Didot on Apple devices,
# Bodoni MT on Windows with Office, and fall back to the system serif elsewhere.
Celadon:
  card-mod-theme: Celadon

  # Theme-own variables, used by the card-mod rules below
  celadon-lit-glaze: "radial-gradient(130% 100% at 28% 12%, rgba(255,255,255,.45), rgba(255,255,255,0) 58%), linear-gradient(165deg, #c4e5cf 0%, #a8d5b9 55%, #95c7a8 100%)"
  celadon-lit-text: "#0c2418"
  celadon-lit-text-2: "#2c4a39"
  celadon-lit-control: "#2f6e4b"
  celadon-lit-edge: "inset 0 1px 0 rgba(255,255,255,.75), inset 0 -2px 3px rgba(20,60,40,.30), inset 0 0 16px rgba(20,60,40,.18), 0 2px 3px rgba(0,0,0,.45)"
  celadon-tile-glaze: "radial-gradient(130% 100% at 28% 12%, rgba(255,255,255,.07), rgba(255,255,255,0) 58%), linear-gradient(165deg, #183c29 0%, #11301f 58%, #0d2618 100%)"
  celadon-numbers: "'Bodoni 72', Didot, 'Bodoni MT', 'Noto Serif Display', 'Bodoni Moda', 'Libre Bodoni', ui-serif, Georgia, serif"

  # Core colours: celadon for actions and selection, gold for rings and sliders
  primary-color: "#a8d5b9"
  accent-color: "#d4b062"
  text-primary-color: "#0c2418"
  primary-text-color: "#ece6d2"
  secondary-text-color: "#b6bfae"
  disabled-text-color: "#7d887a"
  # Newer frontends colour buttons, switches and tabs from this scale instead of primary-color.
  ha-color-primary-05: "#071810"
  ha-color-primary-10: "#0c2418"
  ha-color-primary-20: "#16402b"
  ha-color-primary-30: "#22603f"
  ha-color-primary-40: "#3a7d57"
  ha-color-primary-50: "#5c9b76"
  ha-color-primary-60: "#7fb795"
  ha-color-primary-70: "#a8d5b9"
  ha-color-primary-80: "#c6e6d1"
  ha-color-primary-90: "#e0f1e6"
  ha-color-primary-95: "#eff8f2"

  # Grout behind dashboards and settings
  primary-background-color: "#232522"
  secondary-background-color: "#1b1d1a"
  lovelace-background: "#232522"

  # Tiles: glaze as a gradient, bulge and gloss edge as inset shadows
  card-background-color: "#12301f"
  ha-card-background: "var(--celadon-tile-glaze)"
  ha-card-border-color: "#09190f"
  ha-card-border-width: "1px"
  ha-card-border-radius: "7px"
  ha-card-box-shadow: "inset 0 1px 0 rgba(214,255,228,.20), inset 1px 0 0 rgba(214,255,228,.07), inset 0 -2px 3px rgba(0,0,0,.40), inset 0 0 18px rgba(0,0,0,.30), 0 2px 3px rgba(0,0,0,.50)"
  # Grout: one narrow joint between all tiles in a section, like a tiled wall
  ha-section-grid-row-gap: "6px"
  ha-section-grid-column-gap: "6px"
  # Ceramic edges: small radii everywhere instead of the soft default scale
  ha-border-radius-sm: "2px"
  ha-border-radius-md: "4px"
  ha-border-radius-lg: "7px"
  ha-border-radius-xl: "8px"
  ha-border-radius-2xl: "10px"
  ha-border-radius-3xl: "10px"
  ha-border-radius-4xl: "10px"
  ha-border-radius-5xl: "10px"
  ha-border-radius-6xl: "10px"
  # Icons sit on small square inlays, badges and tile controls are tiles too
  ha-tile-icon-border-radius: "5px"
  ha-badge-border-radius: "7px"
  ha-card-features-border-radius: "4px"
  divider-color: "rgba(236,230,210,.14)"
  ha-color-border-neutral-quiet: "rgba(236,230,210,.14)"

  # Dialogs
  ha-dialog-border-radius: "10px"
  ha-dialog-surface-background: "#12301f"
  mdc-theme-surface: "#12301f"
  mdc-dialog-scrim-color: "rgba(0,0,0,.55)"
  paper-dialog-background-color: "#12301f"

  # Header and sidebar
  app-header-background-color: "#12301f"
  app-header-text-color: "#ece6d2"
  app-header-border-bottom: "1px solid #09190f"
  sidebar-background-color: "#1b1d1a"
  sidebar-text-color: "#ece6d2"
  sidebar-icon-color: "#d4b062"
  sidebar-selected-text-color: "#ece6d2"
  sidebar-selected-icon-color: "#a8d5b9"
  sidebar-menu-button-text-color: "#ece6d2"

  # Inputs and forms
  input-fill-color: "#0d2618"
  input-ink-color: "var(--primary-text-color)"
  input-label-ink-color: "var(--secondary-text-color)"
  input-idle-line-color: "#6f7d6e"
  input-hover-line-color: "var(--primary-color)"
  input-outlined-idle-border-color: "#6f7d6e"
  input-outlined-hover-border-color: "var(--primary-color)"
  mdc-text-field-fill-color: "#0d2618"
  mdc-select-fill-color: "#0d2618"
  ha-color-form-background: "#0d2618"
  code-editor-background-color: "#0d2618"
  markdown-code-background-color: "#0d2618"
  switch-checked-button-color: "#d4b062"
  switch-checked-track-color: "#d4b062"
  switch-unchecked-button-color: "#b6bfae"
  switch-unchecked-track-color: "#6f7d6e"
  # Switches of current frontends read these instead of the switch-* names above
  ha-switch-checked-background-color: "#d4b062"
  ha-switch-checked-background-color-hover: "#dcbc74"
  ha-switch-checked-border-color: "#d4b062"
  ha-switch-checked-thumb-background-color: "#0c2418"
  ha-switch-checked-thumb-border-color: "transparent"
  ha-switch-border-color: "#6f7d6e"
  ha-switch-background-color: "#0d2618"
  # Keyboard focus ring in gold, the colour of lines in this theme
  ha-color-focus: "#d4b062"

  # Sliders in gold (thermostat rings take the climate state colours below)
  control-slider-color: "#d4b062"
  control-slider-thickness: "36px"

  # Typography: a humanist sans for text, a Didone serif for titles
  ha-font-family-body: "Optima, Candara, 'Segoe UI', 'Noto Sans', system-ui, sans-serif"
  ha-font-family-heading: "var(--celadon-numbers)"
  ha-card-header-font-family: "var(--celadon-numbers)"
  ha-font-family-code: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  code-font-family: "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"

  # State colours as historical glazes: celadon = running or secure, gold = warmth and attention,
  # cobalt = cooling, oxblood = open or alarm. Everything off is a quiet cream.
  celadon-glaze: "#a8d5b9"
  gold-glaze: "#d4b062"
  cobalt-glaze: "#95b1e3"
  oxblood-glaze: "#efa494"
  state-icon-color: "#e2d3a3"
  state-inactive-color: "#9aa596"
  state-active-color: "var(--celadon-glaze)"
  state-light-active-color: "var(--celadon-glaze)"
  state-switch-active-color: "var(--celadon-glaze)"
  state-fan-active-color: "var(--celadon-glaze)"
  state-media_player-active-color: "var(--celadon-glaze)"
  state-cover-active-color: "var(--celadon-glaze)"
  state-valve-active-color: "var(--celadon-glaze)"
  state-vacuum-active-color: "var(--celadon-glaze)"
  state-humidifier-on-color: "var(--celadon-glaze)"
  state-lawn_mower-active-color: "var(--celadon-glaze)"
  state-person-home-color: "var(--celadon-glaze)"
  state-device_tracker-home-color: "var(--celadon-glaze)"
  state-lock-locked-color: "var(--celadon-glaze)"
  state-lock-locking-color: "var(--gold-glaze)"
  state-lock-unlocking-color: "var(--gold-glaze)"
  state-lock-opening-color: "var(--gold-glaze)"
  state-lock-unlocked-color: "var(--oxblood-glaze)"
  state-lock-open-color: "var(--oxblood-glaze)"
  state-lock-jammed-color: "var(--oxblood-glaze)"
  state-binary_sensor-active-color: "var(--gold-glaze)"
  state-update-active-color: "var(--gold-glaze)"
  state-siren-active-color: "var(--oxblood-glaze)"
  state-vacuum-error-color: "var(--oxblood-glaze)"
  state-lawn_mower-error-color: "var(--oxblood-glaze)"
  state-alarm_control_panel-arming-color: "var(--gold-glaze)"
  state-alarm_control_panel-pending-color: "var(--gold-glaze)"
  state-alarm_control_panel-disarming-color: "var(--gold-glaze)"
  state-alarm_control_panel-triggered-color: "var(--oxblood-glaze)"
  state-alarm_control_panel-armed_away-color: "var(--celadon-glaze)"
  state-alarm_control_panel-armed_home-color: "var(--celadon-glaze)"
  state-alarm_control_panel-armed_night-color: "var(--celadon-glaze)"
  state-alarm_control_panel-armed_vacation-color: "var(--celadon-glaze)"
  state-alarm_control_panel-armed_custom_bypass-color: "var(--celadon-glaze)"
  state-climate-heat-color: "var(--gold-glaze)"
  state-climate-cool-color: "var(--cobalt-glaze)"
  state-climate-heat-cool-color: "var(--celadon-glaze)"
  state-climate-auto-color: "var(--celadon-glaze)"
  state-climate-dry-color: "#8cc6c8"
  state-climate-fan_only-color: "#8cc6c8"
  state-climate-off-color: "#7d887a"
  success-color: "#8fd0a5"
  warning-color: "#e3b45a"
  # Hex, not var(): the frontend derives the rgb-* partners for tinted surfaces only from hex values
  error-color: "#efa494"
  amber-color: "#d4b062"
  orange-color: "#d99a52"
  red-color: "#efa494"
  green-color: "#8fd0a5"
  teal-color: "#8cc6c8"
  cyan-color: "#8cc6c8"
  blue-color: "#95b1e3"
  indigo-color: "#a3a8dc"
  purple-color: "#c4a3d4"
  deep-purple-color: "#b8a0d8"
  grey-color: "#9aa596"
  # Gauges take the info colour: gold like the other rings
  info-color: "#d4b062"
  # History and statistics graphs: gold first, then celadon and glaze tones
  graph-color-1: "#d4b062"
  graph-color-2: "#a8d5b9"
  graph-color-3: "#8cc6c8"
  graph-color-4: "#e2d3a3"
  graph-color-5: "#d79a8a"
  # Weather icons in glaze colours
  weather-icon-sun-color: "#e2c06a"
  weather-icon-moon-color: "#ece6d2"
  weather-icon-rain-color: "#8cc6c8"
  weather-icon-cloud-front-color: "#dcdccf"
  weather-icon-cloud-back-color: "#a9ae9f"

  # Optional, card-mod 4.x: a tile turns into celadon glaze while its device is running (on, open, playing,
  # heating, cleaning ...), decided by the state, not by the kind of device. Sensors and binary sensors stay
  # dark, a paused player or a closed cover too. On the lit tile the icon takes the tile's text colour and tile
  # controls a deeper pooled glaze, so a slider stays visible on the celadon.
  card-mod-card: |
    :host(hui-heading-card) .title .heading { font-family: var(--celadon-numbers); font-size: 20px; }
    ha-card.active:has(ha-tile-icon:not([data-domain=sensor], [data-domain=binary_sensor]):is([data-state=on], [data-state=open], [data-state=opening], [data-state=closing], [data-state=playing], [data-state=heat], [data-state=cool], [data-state=heat_cool], [data-state=auto], [data-state=dry], [data-state=fan_only], [data-state=cleaning], [data-state=returning], [data-state=mowing]), ha-tile-icon[data-domain=water_heater]:not([data-state=off])) {
      --ha-card-background: var(--celadon-lit-glaze);
      background: var(--celadon-lit-glaze);
      box-shadow: var(--celadon-lit-edge);
      --primary-text-color: var(--celadon-lit-text);
      --secondary-text-color: var(--celadon-lit-text-2);
      --tile-icon-color: var(--celadon-lit-text);
      --feature-color: var(--celadon-lit-control);
      --state-active-color: var(--celadon-lit-control);
      --state-light-active-color: var(--celadon-lit-control);
      --state-switch-active-color: var(--celadon-lit-control);
      --state-fan-active-color: var(--celadon-lit-control);
      --state-media_player-active-color: var(--celadon-lit-control);
      --state-cover-active-color: var(--celadon-lit-control);
      --state-valve-active-color: var(--celadon-lit-control);
      --state-vacuum-active-color: var(--celadon-lit-control);
      --state-humidifier-on-color: var(--celadon-lit-control);
    }
    /* Keyboard focus: the tile draws a 1 px ring in the state colour, and the lit tile's own shadow would hide it.
       A 2 px ring in the focus colour, 2 px away from the tile, sits in the grout around every tile instead. */
    ha-card:has(ha-tile-container[focused]) {
      border-color: var(--ha-color-focus) !important;
      box-shadow: var(--ha-card-box-shadow), 0 0 0 2px var(--primary-background-color), 0 0 0 4px var(--ha-color-focus) !important;
    }
    ha-card.active:has(ha-tile-icon:not([data-domain=sensor], [data-domain=binary_sensor]):is([data-state=on], [data-state=open], [data-state=opening], [data-state=closing], [data-state=playing], [data-state=heat], [data-state=cool], [data-state=heat_cool], [data-state=auto], [data-state=dry], [data-state=fan_only], [data-state=cleaning], [data-state=returning], [data-state=mowing]), ha-tile-icon[data-domain=water_heater]:not([data-state=off])):has(ha-tile-container[focused]) {
      box-shadow: var(--celadon-lit-edge), 0 0 0 2px var(--primary-background-color), 0 0 0 4px var(--ha-color-focus) !important;
    }
    /* Same selector as the rule above (keep in sync): inline icon and slider colours need !important */
    ha-card.active:has(ha-tile-icon:not([data-domain=sensor], [data-domain=binary_sensor]):is([data-state=on], [data-state=open], [data-state=opening], [data-state=closing], [data-state=playing], [data-state=heat], [data-state=cool], [data-state=heat_cool], [data-state=auto], [data-state=dry], [data-state=fan_only], [data-state=cleaning], [data-state=returning], [data-state=mowing]), ha-tile-icon[data-domain=water_heater]:not([data-state=off])) :is(ha-tile-icon, hui-card-features) {
      --tile-icon-color: var(--celadon-lit-text) !important;
      --feature-color: var(--celadon-lit-control) !important;
    }
  # Optional, card-mod 4.x: the dashboard title in the Didone serif, like a glazed name plate
  card-mod-root: |
    .main-title { font-family: var(--celadon-numbers); font-size: 26px; letter-spacing: .01em; }
  # Optional, card-mod 4.x: sidebar entries as small glazed tiles
  card-mod-sidebar: |
    :host { font-family: var(--ha-font-family-body); }
    .title { font-family: var(--celadon-numbers); font-size: 22px; }
    ha-list-item-button {
      margin: 3px 6px;
      border-radius: 6px;
      background: var(--celadon-tile-glaze);
      box-shadow: var(--ha-card-box-shadow);
    }
    ha-list-item-button.selected {
      background: var(--celadon-lit-glaze);
      box-shadow: var(--celadon-lit-edge);
      --sidebar-selected-text-color: var(--celadon-lit-text);
      --sidebar-selected-icon-color: var(--celadon-lit-text);
    }

  modes:
    dark: {}
    light:
      celadon-tile-glaze: "radial-gradient(130% 100% at 28% 12%, rgba(255,255,255,.60), rgba(255,255,255,0) 58%), linear-gradient(165deg, #e2ede0 0%, #d2e3d3 58%, #c4d9c7 100%)"
      celadon-lit-glaze: "radial-gradient(130% 100% at 28% 12%, rgba(255,255,255,.14), rgba(255,255,255,0) 58%), linear-gradient(165deg, #1f4d34 0%, #173f2a 58%, #113322 100%)"
      celadon-lit-text: "#f2ecd9"
      celadon-lit-text-2: "#dde3d4"
      celadon-lit-control: "#a8d5b9"
      celadon-lit-edge: "inset 0 1px 0 rgba(214,255,228,.30), inset 0 -2px 3px rgba(0,0,0,.40), inset 0 0 16px rgba(0,0,0,.25), 0 2px 3px rgba(40,50,40,.35)"
      primary-color: "#255f40"
      # Plain buttons and active tabs read primary-40; the dark-mode value is too light on pale glaze
      ha-color-primary-40: "#255f40"
      accent-color: "#8a6a1e"
      text-primary-color: "#f7f3e6"
      primary-text-color: "#14281d"
      secondary-text-color: "#3f5145"
      disabled-text-color: "#7f8c81"
      primary-background-color: "#c9c5b8"
      secondary-background-color: "#d6d3c8"
      lovelace-background: "#c9c5b8"
      card-background-color: "#dbe8da"
      ha-card-border-color: "rgba(60,75,62,.30)"
      ha-card-box-shadow: "inset 0 1px 0 rgba(255,255,255,.95), inset 1px 0 0 rgba(255,255,255,.5), inset 0 -2px 3px rgba(40,70,50,.18), inset 0 0 18px rgba(40,70,50,.10), 0 2px 3px rgba(60,55,40,.30)"
      divider-color: "rgba(20,40,29,.16)"
      ha-color-border-neutral-quiet: "rgba(20,40,29,.16)"
      ha-dialog-surface-background: "#e2ebe0"
      mdc-theme-surface: "#e2ebe0"
      mdc-dialog-scrim-color: "rgba(20,30,24,.40)"
      paper-dialog-background-color: "#e2ebe0"
      app-header-background-color: "#e2ebe0"
      app-header-text-color: "#14281d"
      app-header-border-bottom: "1px solid rgba(60,75,62,.30)"
      sidebar-background-color: "#d6d3c8"
      sidebar-text-color: "#14281d"
      sidebar-icon-color: "#8a6a1e"
      sidebar-selected-text-color: "#14281d"
      sidebar-selected-icon-color: "#255f40"
      sidebar-menu-button-text-color: "#14281d"
      input-fill-color: "#f1f5ee"
      input-idle-line-color: "#6b7a6e"
      input-outlined-idle-border-color: "#6b7a6e"
      mdc-text-field-fill-color: "#f1f5ee"
      mdc-select-fill-color: "#f1f5ee"
      ha-color-form-background: "#f1f5ee"
      code-editor-background-color: "#f1f5ee"
      markdown-code-background-color: "#f1f5ee"
      switch-checked-button-color: "#8a6a1e"
      switch-checked-track-color: "#8a6a1e"
      switch-unchecked-button-color: "#3f5145"
      switch-unchecked-track-color: "#9aa69c"
      ha-switch-checked-background-color: "#8a6a1e"
      ha-switch-checked-background-color-hover: "#7a5c14"
      ha-switch-checked-border-color: "#8a6a1e"
      ha-switch-checked-thumb-background-color: "#f7f3e6"
      ha-switch-border-color: "#6b7a6e"
      ha-switch-background-color: "#f1f5ee"
      ha-color-focus: "#255f40"
      control-slider-color: "#8a6a1e"
      celadon-glaze: "#255f40"
      gold-glaze: "#7a5c14"
      cobalt-glaze: "#2c4f8c"
      oxblood-glaze: "#8f2a22"
      state-icon-color: "#6f561a"
      # The frontend draws thermostat arcs half transparent: a darker gold keeps them readable on pale glaze
      state-climate-heat-color: "#6f561a"
      state-inactive-color: "#5f6f63"
      state-climate-off-color: "#7f8c81"
      state-climate-dry-color: "#2e6e73"
      state-climate-fan_only-color: "#2e6e73"
      success-color: "#255f40"
      warning-color: "#8a5a10"
      error-color: "#8f2a22"
      amber-color: "#8a6a1e"
      orange-color: "#9a5418"
      red-color: "#8f2a22"
      green-color: "#255f40"
      teal-color: "#2e6e73"
      cyan-color: "#2e6e73"
      blue-color: "#2c4f8c"
      indigo-color: "#4a4f9a"
      purple-color: "#7a4a8f"
      deep-purple-color: "#6a4a9a"
      grey-color: "#5f6f63"
      info-color: "#8a6a1e"
      graph-color-1: "#8a6a1e"
      graph-color-2: "#255f40"
      graph-color-3: "#2e6e73"
      graph-color-4: "#6f561a"
      graph-color-5: "#9a4a3a"
      weather-icon-sun-color: "#c79a2e"
      weather-icon-moon-color: "#8a6a1e"
      weather-icon-rain-color: "#2e6e73"
      weather-icon-cloud-front-color: "#f4f6f0"
      weather-icon-cloud-back-color: "#9aa69c"
